<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌈 Nauka Angielskiego - Pory Roku i Ubrania</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Comic Sans MS', 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            background: white;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        h1 {
            color: #667eea;
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        .active-categories {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 15px;
            padding: 10px;
        }

        .category-badge {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: bold;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .stat-item {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            padding: 10px 20px;
            border-radius: 15px;
            color: white;
            font-weight: bold;
            font-size: 1.1em;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .mode-selector {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .mode-btn {
            padding: 15px 30px;
            font-size: 1.2em;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .mode-btn.active {
            transform: scale(1.1);
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
        }

        .mode-btn.quiz {
            background: linear-gradient(135deg, #30cfd0 0%, #330867 100%);
            color: white;
        }

        .mode-btn.spelling {
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
        }

        .mode-btn.edit {
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
        }

        .mode-btn.settings {
            background: linear-gradient(135deg, #ff9a56 0%, #ff6a88 100%);
            color: white;
        }

        .mode-btn.stickers {
            background: linear-gradient(135deg, #ffeaa7 0%, #fdcb6e 100%);
        }

        .game-container {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        /* Quiz Mode Styles */
        .quiz-container {
            text-align: center;
        }

        .quiz-question {
            font-size: 2em;
            margin: 30px 0;
            padding: 20px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .quiz-emoji {
            font-size: 3em;
            margin: 20px 0;
        }

        .quiz-options {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 30px;
        }

        .quiz-option {
            padding: 20px;
            font-size: 1.3em;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .quiz-option:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 15px rgba(0,0,0,0.3);
        }

        .quiz-option.correct {
            background: linear-gradient(135deg, #52c234 0%, #61dd3b 100%);
            color: white;
            animation: pulse 0.5s;
        }

        .quiz-option.incorrect {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a6f 100%);
            color: white;
            animation: shake 0.5s;
        }

        /* Spelling Mode Styles */
        .spelling-container {
            text-align: center;
        }

        .spelling-word {
            font-size: 2.5em;
            margin: 30px 0;
            padding: 20px;
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
            color: white;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .spelling-emoji {
            font-size: 4em;
            margin: 20px 0;
        }

        .spelling-input {
            padding: 20px;
            font-size: 1.8em;
            border: 4px solid #667eea;
            border-radius: 15px;
            text-align: center;
            width: 100%;
            max-width: 500px;
            margin: 30px auto;
            display: block;
            font-weight: bold;
            transition: all 0.3s;
        }

        .spelling-input:focus {
            outline: none;
            border-color: #764ba2;
            box-shadow: 0 0 20px rgba(102, 126, 234, 0.3);
        }

        .spelling-input.correct {
            border-color: #52c234;
            background: #e8f5e9;
        }

        .spelling-input.incorrect {
            border-color: #ff6b6b;
            background: #ffebee;
            animation: shake 0.5s;
        }

        .spelling-feedback {
            font-size: 1.5em;
            margin: 20px 0;
            padding: 15px;
            border-radius: 15px;
            font-weight: bold;
        }

        .spelling-feedback.correct {
            background: linear-gradient(135deg, #52c234 0%, #61dd3b 100%);
            color: white;
        }

        .spelling-feedback.incorrect {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a6f 100%);
            color: white;
        }

        /* Edit Mode Styles */
        .edit-container {
            max-width: 900px;
            margin: 0 auto;
        }

        .edit-section {
            margin-bottom: 30px;
        }

        .edit-section h3 {
            color: #667eea;
            font-size: 1.8em;
            margin-bottom: 15px;
            text-align: center;
        }

        .word-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .word-item {
            display: grid;
            grid-template-columns: 60px 1fr 1fr 80px 80px;
            gap: 10px;
            padding: 15px;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            border-radius: 10px;
            align-items: center;
        }

        .word-item input {
            padding: 10px;
            border: 2px solid #667eea;
            border-radius: 8px;
            font-size: 1.1em;
            text-align: center;
        }

        .word-item .emoji-input {
            font-size: 1.5em;
            text-align: center;
        }

        .delete-btn {
            padding: 8px 15px;
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a6f 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        .delete-btn:hover {
            transform: scale(1.05);
        }

        .add-btn {
            padding: 12px 25px;
            background: linear-gradient(135deg, #52c234 0%, #61dd3b 100%);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1.1em;
            margin-top: 10px;
            transition: all 0.3s;
        }

        .add-btn:hover {
            transform: scale(1.05);
        }

        .save-btn {
            padding: 15px 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1.3em;
            margin: 20px auto;
            display: block;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            transition: all 0.3s;
        }

        .save-btn:hover {
            transform: scale(1.05);
        }

        .import-export {
            margin-top: 30px;
            padding: 20px;
            background: white;
            border-radius: 15px;
            border: 2px dashed #667eea;
        }

        .import-export h4 {
            color: #667eea;
            margin-bottom: 10px;
        }

        .import-export textarea {
            width: 100%;
            min-height: 100px;
            padding: 10px;
            border: 2px solid #667eea;
            border-radius: 8px;
            font-family: monospace;
            font-size: 0.9em;
        }

        .import-export button {
            margin: 5px;
        }

        /* Category Management Styles */
        .category-management {
            background: white;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            border: 2px solid #667eea;
        }

        .category-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 15px;
        }

        .category-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            border-radius: 10px;
        }

        .category-item-left {
            display: flex;
            align-items: center;
            gap: 15px;
            flex: 1;
        }

        .category-item input[type="text"] {
            flex: 1;
            padding: 8px;
            border: 2px solid #667eea;
            border-radius: 8px;
            font-size: 1.1em;
        }

        .category-item .category-checkbox {
            width: 24px;
            height: 24px;
            cursor: pointer;
        }

        .category-item .word-count {
            color: #666;
            font-size: 0.9em;
            min-width: 80px;
            text-align: center;
        }

        .add-category-btn {
            padding: 12px 25px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1.1em;
            margin-top: 10px;
            transition: all 0.3s;
        }

        .add-category-btn:hover {
            transform: scale(1.05);
        }

        /* Stickers Mode Styles */
        .stickers-container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .stickers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 15px;
            margin: 20px 0;
            padding: 20px;
            background: white;
            border-radius: 15px;
        }

        .sticker-item {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3em;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        .sticker-item:hover {
            transform: scale(1.1);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .sticker-item.locked {
            opacity: 0.3;
            cursor: default;
            filter: grayscale(100%);
        }

        .sticker-item.locked:hover {
            transform: none;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        .sticker-item.new {
            animation: stickerAppear 0.5s;
        }

        @keyframes stickerAppear {
            0% {
                transform: scale(0) rotate(0deg);
                opacity: 0;
            }
            50% {
                transform: scale(1.2) rotate(180deg);
            }
            100% {
                transform: scale(1) rotate(360deg);
                opacity: 1;
            }
        }

        .sticker-category {
            margin-bottom: 30px;
        }

        .sticker-category h3 {
            color: #667eea;
            font-size: 1.6em;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sticker-progress {
            background: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
        }

        .sticker-progress-bar {
            background: #e0e0e0;
            height: 30px;
            border-radius: 15px;
            overflow: hidden;
            margin: 10px 0;
        }

        .sticker-progress-fill {
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            transition: width 0.5s;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }

        .sticker-reward-popup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            text-align: center;
            z-index: 10000;
            animation: stickerRewardAppear 0.5s;
        }

        .sticker-reward-popup .sticker-display {
            font-size: 6em;
            margin: 20px 0;
            animation: rotate 2s infinite;
        }

        @keyframes stickerRewardAppear {
            from {
                transform: translate(-50%, -50%) scale(0);
                opacity: 0;
            }
            to {
                transform: translate(-50%, -50%) scale(1);
                opacity: 1;
            }
        }

        @keyframes rotate {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-10deg); }
            75% { transform: rotate(10deg); }
        }

        /* Settings Mode Styles */
        .settings-container {
            max-width: 800px;
            margin: 0 auto;
        }

        .settings-section {
            background: white;
            padding: 25px;
            margin-bottom: 20px;
            border-radius: 15px;
            border: 2px solid #667eea;
        }

        .settings-section h3 {
            color: #667eea;
            font-size: 1.6em;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .setting-item {
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px solid #e0e0e0;
        }

        .setting-item:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .setting-label {
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
            font-size: 1.1em;
        }

        .setting-description {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 10px;
        }

        .setting-input {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }

        .setting-input input[type="number"] {
            padding: 10px;
            border: 2px solid #667eea;
            border-radius: 8px;
            font-size: 1.1em;
            width: 100px;
            text-align: center;
        }

        .setting-input select {
            padding: 10px 15px;
            border: 2px solid #667eea;
            border-radius: 8px;
            font-size: 1.1em;
            background: white;
            cursor: pointer;
            min-width: 200px;
        }

        .voice-test-btn {
            padding: 10px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        .voice-test-btn:hover {
            transform: scale(1.05);
        }

        .settings-info {
            background: linear-gradient(135deg, #e0f7fa 0%, #e1bee7 100%);
            padding: 15px;
            border-radius: 10px;
            margin-top: 10px;
            font-size: 0.95em;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 60px;
            height: 34px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 34px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 26px;
            width: 26px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        input:checked + .slider:before {
            transform: translateX(26px);
        }

        /* Confetti Animation */
        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            background: #f0f;
            position: absolute;
            animation: confetti-fall 3s linear forwards;
            z-index: 9999;
        }

        @keyframes confetti-fall {
            to {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* Sound Button */
        .sound-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            font-size: 2em;
            cursor: pointer;
            color: white;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: all 0.3s;
            margin: 10px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .sound-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
        }

        .sound-btn:active {
            transform: scale(0.95);
        }

        .milestone-popup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            text-align: center;
            z-index: 10000;
            animation: milestoneAppear 0.5s;
            color: white;
        }

        .milestone-popup h2 {
            font-size: 3em;
            margin-bottom: 20px;
        }

        .milestone-popup p {
            font-size: 1.5em;
        }

        @keyframes milestoneAppear {
            from {
                transform: translate(-50%, -50%) scale(0);
                opacity: 0;
            }
            to {
                transform: translate(-50%, -50%) scale(1);
                opacity: 1;
            }
        }

        .celebration {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            text-align: center;
            z-index: 1000;
            animation: slideIn 0.5s;
        }

        .celebration h2 {
            color: #667eea;
            font-size: 2.5em;
            margin-bottom: 20px;
        }

        .celebration-emoji {
            font-size: 4em;
            margin: 20px 0;
        }

        .play-again-btn {
            padding: 15px 40px;
            font-size: 1.3em;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            font-weight: bold;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            margin-top: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .play-again-btn:hover {
            transform: scale(1.05);
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        @keyframes slideIn {
            from {
                transform: translate(-50%, -50%) scale(0);
            }
            to {
                transform: translate(-50%, -50%) scale(1);
            }
        }

        .input-answer {
            padding: 15px;
            font-size: 1.5em;
            border: 3px solid #667eea;
            border-radius: 15px;
            text-align: center;
            width: 100%;
            max-width: 400px;
            margin: 20px auto;
            display: block;
        }

        .submit-btn {
            padding: 15px 40px;
            font-size: 1.3em;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            font-weight: bold;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            margin: 10px;
        }

        .submit-btn:hover {
            transform: scale(1.05);
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.8em;
            }
            
            .quiz-options {
                grid-template-columns: 1fr;
            }

            .spelling-input {
                font-size: 1.5em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🌈 Nauka Angielskiego</h1>
            <div class="active-categories" id="activeCategoriesDisplay"></div>
            <div class="stats">
                <div class="stat-item">⭐ Punkty: <span id="score">0</span></div>
                <div class="stat-item">🎯 Poprawne: <span id="correct">0</span></div>
                <div class="stat-item">❌ Błędy: <span id="incorrect">0</span></div>
            </div>
        </header>

        <div class="mode-selector">
            <button class="mode-btn quiz active" onclick="setMode('quiz')">❓ Quiz - Wybierz odpowiedź</button>
            <button class="mode-btn spelling" onclick="setMode('spelling')">✍️ Sprawdź pisownię</button>
            <button class="mode-btn stickers" onclick="setMode('stickers')">🎁 Moje naklejki (<span id="stickerCount">0</span>)</button>
            <button class="mode-btn edit" onclick="setMode('edit')">📝 Edytuj słówka</button>
            <button class="mode-btn settings" onclick="setMode('settings')">⚙️ Opcje</button>
        </div>

        <div class="game-container" id="gameContainer"></div>
    </div>

    <script>
        // Load vocabulary from localStorage or use default
        const defaultVocabulary = {
            seasons: [
                { polish: 'zima', english: 'winter', emoji: '❄️' },
                { polish: 'wiosna', english: 'spring', emoji: '🌸' },

        function checkMilestones() {
            if (!settings.enableConfetti && !settings.enableSound) return;
            
            // Every X correct answers (configurable)
            if (correct > 0 && settings.correctAnswersMilestone > 0 && 
                correct % settings.correctAnswersMilestone === 0 && correct !== lastMilestone) {
                lastMilestone = correct;
                showMilestone(`🎯 ${correct} poprawnych odpowiedzi!`, '🌟⭐✨');
                if (settings.enableConfetti) createConfetti();
            }
            
            // Every X points (configurable)
            if (score > 0 && settings.scoreMilestone > 0 && 
                score % settings.scoreMilestone === 0 && score !== lastScoreMilestone) {
                lastScoreMilestone = score;
                showMilestone(`💯 ${score} punktów!`, '🎉🎊🎈');
                if (settings.enableConfetti) createConfetti();
            }
        }

        function checkStickerReward() {
            // Check if user earned a new sticker
            if (correct > 0 && settings.stickerRewardInterval > 0 &&
                correct % settings.stickerRewardInterval === 0 && correct !== lastStickerReward) {
                lastStickerReward = correct;
                rewardSticker();
            }
        }

        function rewardSticker() {
            // Get all available stickers
            const allStickers = Object.values(availableStickers).flat();
            
            // Get unearned stickers
            const unearnedStickers = allStickers.filter(s => !earnedStickers.includes(s));
            
            if (unearnedStickers.length === 0) {
                // All stickers collected!
                showStickerReward('🏆', 'Brawo! Masz wszystkie naklejki!');
                return;
            }
            
            // Select random sticker
            const newSticker = unearnedStickers[Math.floor(Math.random() * unearnedStickers.length)];
            
            // Add to earned stickers
            earnedStickers.push(newSticker);
            saveStickers(earnedStickers);
            
            // Show reward popup
            showStickerReward(newSticker, 'Nowa naklejka!');
            
            // Create confetti
            if (settings.enableConfetti) createConfetti();
            if (settings.enableSound) playSound('celebration');
            
            // Update counter
            document.getElementById('stickerCount').textContent = earnedStickers.length;
        }

            document.body.appendChild(popup);
            
            setTimeout(() => {

                    popup.remove();

        function createConfetti() {
            const colors = ['#ff6b6b', '#4ecdc4', '#45b7d1', '#f7d794', '#778beb', '#f8a5c2', '#63cdda'];
            const confettiCount = 50;
            
            for (let i = 0; i < confettiCount; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.left = Math.random() * 100 + 'vw';
                    confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
                    confetti.style.width = (Math.random() * 10 + 5) + 'px';
                    confetti.style.height = (Math.random() * 10 + 5) + 'px';
                    confetti.style.animationDuration = (Math.random() * 2 + 2) + 's';
                    confetti.style.animationDelay = (Math.random() * 0.5) + 's';
                    
                    document.body.appendChild(confetti);
                    
                    setTimeout(() => {
                        confetti.remove();
                    }, 3000);
                }, i * 30);
            }
        }

        function speakWord(word, lang = 'en-US') {
            if ('speechSynthesis' in window) {
                // Cancel any ongoing speech
                window.speechSynthesis.cancel();
                
                // Wait a bit for cancel to complete
                setTimeout(() => {
                    const utterance = new SpeechSynthesisUtterance(word);
                    utterance.lang = lang;
                    utterance.rate = settings.voiceRate;
                    utterance.pitch = settings.voicePitch;
                    utterance.volume = 1;
                    
                    // Set voice if specified - IMPORTANT: Get fresh voice list each time
                    if (settings.voiceName) {
                        const voices = window.speechSynthesis.getVoices();
                        const selectedVoice = voices.find(v => v.name === settings.voiceName);
                        if (selectedVoice) {
                            utterance.voice = selectedVoice;
                        }
                    }
                    
                    window.speechSynthesis.speak(utterance);
                }, 100);
            } else {
                alert('Twoja przeglądarka nie obsługuje syntezy mowy. Spróbuj Chrome, Edge lub Safari.');
            }
        }

        function playSound(type) {
            // Create audio context for celebration sound
            if (typeof AudioContext !== 'undefined' || typeof webkitAudioContext !== 'undefined') {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                const audioContext = new AudioContext();
                
                if (type === 'celebration') {
                    // Play a cheerful melody
                    const notes = [523.25, 587.33, 659.25, 783.99, 880.00]; // C, D, E, G, A
                    notes.forEach((freq, index) => {
                        const oscillator = audioContext.createOscillator();
                        const gainNode = audioContext.createGain();
                        
                        oscillator.connect(gainNode);
                        gainNode.connect(audioContext.destination);
                        
                        oscillator.frequency.value = freq;
                        oscillator.type = 'sine';
                        
                        const startTime = audioContext.currentTime + (index * 0.1);
                        gainNode.gain.setValueAtTime(0.3, startTime);
                        gainNode.gain.exponentialRampToValueAtTime(0.01, startTime + 0.3);
                        
                        oscillator.start(startTime);
                        oscillator.stop(startTime + 0.3);
                    });
                }
            }
        }

        function shuffle(array) {
            const newArray = [...array];
            for (let i = newArray.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
            }
            return newArray;
        }

                return;
            }

            const word = allWords[currentQuestion];
            const wrongAnswers = allWords
                .filter(w => w.english !== word.english)
                .sort(() => Math.random() - 0.5)
                .slice(0, 3)
                .map(w => w.english);
            
            const options = shuffle([...wrongAnswers, word.english]);

            container.innerHTML = `
                <div class="quiz-emoji">${word.emoji}</div>
                <div class="quiz-question">Jak po angielsku jest: <br>"${word.polish}"?</div>
                <button class="sound-btn" onclick="speakWord('${word.english}')" title="Posłuchaj wymowy">🔊</button>
                <div class="quiz-options">
                    ${options.map(option => `
                        <button class="quiz-option" onclick="checkAnswer('${option}', '${word.english}')">${option}</button>
                    `).join('')}
                </div>
            `;
        }

        function checkAnswer(selected, correct_answer) {
            const buttons = document.querySelectorAll('.quiz-option');
            buttons.forEach(btn => {
                btn.disabled = true;
                if (btn.textContent === correct_answer) {
                    btn.classList.add('correct');
                }
                if (btn.textContent === selected && selected !== correct_answer) {
                    btn.classList.add('incorrect');
                }
            });

            if (selected === correct_answer) {
                score += 10;
                correct++;
                
                // Play pronunciation on correct answer
                if (settings.autoPlayPronunciation) {
                    setTimeout(() => speakWord(correct_answer), 500);
                }
            } else {
                incorrect++;
            }

            updateStats();
            currentQuestion++;
            setTimeout(() => initGame(), settings.feedbackDisplayTime);
        }

        function initSpellingGame(container) {
            container.className = 'game-container spelling-container';
            
            if (currentQuestion >= allWords.length) {
                showCelebration();
                return;
            }

            const word = allWords[currentQuestion];

            container.innerHTML = `
                <div class="spelling-emoji">${word.emoji}</div>
                <div class="spelling-word">Napisz po angielsku: "${word.polish}"</div>
                <button class="sound-btn" onclick="speakWord('${word.english}')" title="Posłuchaj wymowy">🔊</button>
                <input type="text" 
                       class="spelling-input" 
                       id="spellingInput" 
                       placeholder="Wpisz tutaj..." 
                       autocomplete="off"
                       autofocus>
                <div id="feedback" class="spelling-feedback" style="display: none;"></div>
                <button class="submit-btn" onclick="checkSpelling('${word.english}')">✅ Sprawdź</button>
                <button class="submit-btn" onclick="skipQuestion()" style="background: linear-gradient(135deg, #ffa726 0%, #fb8c00 100%);">⏭️ Pomiń</button>
            `;

            // Allow Enter key to submit
            document.getElementById('spellingInput').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    checkSpelling(word.english);
                }
            });
        }

        function checkSpelling(correctAnswer) {
            const input = document.getElementById('spellingInput');
            const userAnswer = input.value.trim().toLowerCase();
            const feedback = document.getElementById('feedback');

            if (!userAnswer) {
                input.style.borderColor = '#ffa726';
                return;
            }

            input.disabled = true;
            feedback.style.display = 'block';

            if (userAnswer === correctAnswer.toLowerCase()) {
                input.classList.add('correct');
                feedback.className = 'spelling-feedback correct';
                feedback.textContent = `🎉 Świetnie! Poprawna odpowiedź: "${correctAnswer}"`;
                score += 10;
                correct++;
                
                // Play pronunciation on correct answer
                if (settings.autoPlayPronunciation) {
                    setTimeout(() => speakWord(correctAnswer), 500);
                }
            } else {
                input.classList.add('incorrect');
                feedback.className = 'spelling-feedback incorrect';
                feedback.textContent = `❌ Niepoprawnie. Poprawna odpowiedź to: "${correctAnswer}"`;
                incorrect++;
            }

            updateStats();
            currentQuestion++;
            setTimeout(() => initGame(), settings.feedbackDisplayTime);
        }

        function skipQuestion() {
            const feedback = document.getElementById('feedback');
            const word = allWords[currentQuestion];
            
            feedback.style.display = 'block';
            feedback.className = 'spelling-feedback';
            feedback.style.background = 'linear-gradient(135deg, #ffa726 0%, #fb8c00 100%)';
            feedback.style.color = 'white';
            feedback.textContent = `ℹ️ Poprawna odpowiedź to: "${word.english}"`;
            
            document.getElementById('spellingInput').disabled = true;
            currentQuestion++;
            setTimeout(() => initGame(), settings.feedbackDisplayTime);
        }

                const voice = voices.find(v => v.name === select.value);
                if (voice) {
                    info.innerHTML = `
                        <strong>Wybrany głos:</strong> ${voice.name}<br>
                        <strong>Język:</strong> ${voice.lang}<br>
                        <strong>Lokalny:</strong> ${voice.localService ? 'Tak' : 'Nie'}
                    `;
                }
            } else {
                info.innerHTML = '<em>Używany będzie domyślny głos przeglądarki dla języka angielskiego.</em>';

        function testVoice() {

            const voiceName = document.getElementById('voiceSelect').value;
            const rate = parseFloat(document.getElementById('voiceRate').value);
            const pitch = parseFloat(document.getElementById('voicePitch').value);
            
            // Temporarily update settings
            const oldSettings = { ...settings };
            settings.voiceName = voiceName;
            settings.voiceRate = rate;
            settings.voicePitch = pitch;
            
            // Test with a sample word
            speakWord('Hello, welcome!');
            
            // Restore old settings (will be saved when user clicks Save)
            setTimeout(() => {
                settings = oldSettings;
            }, 100);
        }

            settings.enableSound = document.getElementById('enableSound').checked;

        function renderCategoryList() {
            const list = document.getElementById('categoryList');
            if (!list) return;
            
            list.innerHTML = '';
            
            for (const category in vocabulary) {
                const isActive = settings.activeCategories.includes(category);
                const wordCount = vocabulary[category].length;
                const displayName = categoryDisplayNames[category] || category;
                
                const item = document.createElement('div');
                item.className = 'category-item';
                item.innerHTML = `
                    <div class="category-item-left">
                        <input type="checkbox" 
                               class="category-checkbox" 
                               ${isActive ? 'checked' : ''} 
                               onchange="toggleCategory('${category}', this.checked)">
                        <input type="text" 
                               value="${displayName}" 
                               onchange="renameCategoryDisplay('${category}', this.value)"
                               placeholder="Nazwa kategorii">
                        <span class="word-count">${wordCount} słówek</span>
                    </div>
                    <button class="delete-btn" onclick="deleteCategory('${category}')">🗑️</button>
                `;
                list.appendChild(item);
            }
        }

        function renderAllWordLists() {
            for (const category in vocabulary) {
                const listId = category + 'List';
                if (document.getElementById(listId)) {
                    renderWordList(category);
                } else {
                    // Create section for new category
                    createCategorySection(category);
                }
            }
        }

        function createCategorySection(category) {
            const displayName = categoryDisplayNames[category] || category;
            const container = document.querySelector('.edit-container');
            
            // Find the save button
            const saveBtn = container.querySelector('.save-btn');
            
            // Create new section before save button
            const section = document.createElement('div');
            section.className = 'edit-section';
            section.innerHTML = `
                <h3>${displayName}</h3>
                <div class="word-list" id="${category}List"></div>
                <button class="add-btn" onclick="addWord('${category}')">➕ Dodaj słówko</button>
            `;
            
            container.insertBefore(section, saveBtn);
            renderWordList(category);
        }

        function toggleCategory(category, isActive) {
            if (isActive) {
                if (!settings.activeCategories.includes(category)) {
                    settings.activeCategories.push(category);
                }
            } else {
                settings.activeCategories = settings.activeCategories.filter(c => c !== category);
            }
            
            saveSettings(settings);
            updateActiveCategoriesDisplay();
            
            // Show warning if no categories active
            if (settings.activeCategories.length === 0) {
                alert('⚠️ Uwaga! Nie masz żadnej aktywnej kategorii. Gra nie będzie działać!');
            }
        }

        function renameCategoryDisplay(category, newName) {
            if (!newName.trim()) return;
            categoryDisplayNames[category] = newName;
            updateActiveCategoriesDisplay();
        }

        function addNewCategory() {
            const categoryName = prompt('Podaj nazwę nowej kategorii (po angielsku, bez spacji):\nNp: animals, colors, numbers');
            if (!categoryName) return;
            
            // Validate category name
            const cleanName = categoryName.toLowerCase().replace(/[^a-z0-9]/g, '');
            if (!cleanName) {
                alert('❌ Nieprawidłowa nazwa! Użyj tylko liter i cyfr.');
                return;
            }
            
            if (vocabulary[cleanName]) {
                alert('❌ Ta kategoria już istnieje!');
                return;
            }
            
            // Ask for display name
            const displayName = prompt('Podaj nazwę wyświetlaną (po polsku, z emoji):\nNp: 🐾 Zwierzęta, 🎨 Kolory');
            
            // Create new category
            vocabulary[cleanName] = [];
            if (displayName) {
                categoryDisplayNames[cleanName] = displayName;
            }
            
            // Add to active categories
            settings.activeCategories.push(cleanName);
            saveSettings(settings);
            saveVocabulary(vocabulary);
            
            // Refresh display
            renderCategoryList();
            createCategorySection(cleanName);
            updateActiveCategoriesDisplay();
            
            alert(`✅ Utworzono nową kategorię: ${displayName || cleanName}`);
        }

        function deleteCategory(category) {
            if (category === 'seasons' || category === 'clothes') {
                if (!confirm('⚠️ To jest domyślna kategoria! Czy na pewno chcesz ją usunąć?')) {
                    return;
                }
            } else {
                if (!confirm(`Czy na pewno chcesz usunąć kategorię "${categoryDisplayNames[category] || category}"?`)) {
                    return;
                }
            }
            
            // Remove from vocabulary
            delete vocabulary[category];
            
            // Remove from active categories
            settings.activeCategories = settings.activeCategories.filter(c => c !== category);
            
            // Remove from display names
            delete categoryDisplayNames[category];
            
            saveVocabulary(vocabulary);
            saveSettings(settings);
            
            // Refresh display
            initEditMode(document.getElementById('gameContainer'));
        }

        function renderWordList(category) {
            const list = document.getElementById(category + 'List');
            list.innerHTML = '';

            vocabulary[category].forEach((word, index) => {
                const item = document.createElement('div');
                item.className = 'word-item';
                item.innerHTML = `
                    <input type="text" class="emoji-input" value="${word.emoji}" 
                           onchange="updateWord('${category}', ${index}, 'emoji', this.value)">
                    <input type="text" placeholder="Polski" value="${word.polish}" 
                           onchange="updateWord('${category}', ${index}, 'polish', this.value)">
                    <input type="text" placeholder="Angielski" value="${word.english}" 
                           onchange="updateWord('${category}', ${index}, 'english', this.value)">
                    <button class="delete-btn" onclick="deleteWord('${category}', ${index})">🗑️</button>
                `;
                list.appendChild(item);
            });
        }

        function updateWord(category, index, field, value) {
            vocabulary[category][index][field] = value;
            updateImportExport();
        }

        function deleteWord(category, index) {
            if (confirm('Czy na pewno chcesz usunąć to słówko?')) {
                vocabulary[category].splice(index, 1);
                renderWordList(category);
                updateImportExport();
            }
        }

        function addWord(category) {
            vocabulary[category].push({
                polish: '',
                english: '',
                emoji: '📝'
            });
            renderWordList(category);
            updateImportExport();
        }

        function saveAllWords() {
            // Validate that all words have both polish and english
            let valid = true;
            for (let category in vocabulary) {
                vocabulary[category] = vocabulary[category].filter(word => {
                    if (!word.polish || !word.english) {
                        valid = false;
                        return false;
                    }
                    return true;
                });
            }

            if (!valid) {
                alert('⚠️ Usunięto puste wpisy. Wszystkie słówka muszą mieć polskie i angielskie tłumaczenie!');
            }

            saveVocabulary(vocabulary);
            allWords = getActiveWords();
            updateActiveCategoriesDisplay();
            
            // Show success message
            const container = document.getElementById('gameContainer');
            const message = document.createElement('div');
            message.style.cssText = 'text-align: center; padding: 20px; background: linear-gradient(135deg, #52c234 0%, #61dd3b 100%); color: white; border-radius: 15px; margin-top: 20px; font-size: 1.3em; font-weight: bold;';
            message.textContent = '✅ Zapisano! Możesz teraz przejść do quizu lub sprawdzania pisowni.';
            container.appendChild(message);
            
            setTimeout(() => {
                message.remove();
            }, 3000);

            renderAllWordLists();
        }

        function updateImportExport() {
            const textarea = document.getElementById('importExport');
            if (textarea) {
                textarea.value = JSON.stringify(vocabulary, null, 2);
            }
        }

        function copyToClipboard() {
            const textarea = document.getElementById('importExport');
            textarea.select();
            document.execCommand('copy');
            alert('📋 Skopiowano do schowka!');
        }

        function pasteFromClipboard() {
            navigator.clipboard.readText().then(text => {
                try {
                    const data = JSON.parse(text);
                    if (data.seasons && data.clothes) {
                        vocabulary = data;
                        saveVocabulary(vocabulary);
                        allWords = [...vocabulary.seasons, ...vocabulary.clothes];
                        renderWordList('seasons');
                        renderWordList('clothes');
                        updateImportExport();
                        alert('✅ Wklejono i zapisano słówka z schowka!');
                    } else {
                        alert('❌ Nieprawidłowy format JSON! Brak pól "seasons" lub "clothes".');
                    }
                } catch (e) {
                    alert('❌ Błąd: To nie jest prawidłowy JSON!\n\n' + e.message);
                }
            }).catch(err => {
                alert('❌ Nie można odczytać schowka. Sprawdź uprawnienia przeglądarki.');
            });
        }

        function exportToJSON() {
            const dataStr = JSON.stringify(vocabulary, null, 2);
            const dataBlob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(dataBlob);
            const link = document.createElement('a');
            link.href = url;
            link.download = 'slowka_' + new Date().toISOString().split('T')[0] + '.json';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
            
            alert('✅ Plik JSON został pobrany!');
        }

        function importFromJSON(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    
                    // Validate structure
                    if (!data.seasons || !data.clothes) {
                        alert('❌ Nieprawidłowy format pliku JSON!\n\nPlik musi zawierać pola "seasons" i "clothes".');
                        return;
                    }
                    
                    // Validate data
                    const isValid = data.seasons.every(w => w.polish && w.english && w.emoji) &&
                                   data.clothes.every(w => w.polish && w.english && w.emoji);
                    
                    if (!isValid) {
                        alert('❌ Niektóre słówka są niepełne!\n\nKażde słówko musi mieć: polish, english, emoji.');
                        return;
                    }
                    
                    // Import successful
                    vocabulary = data;
                    saveVocabulary(vocabulary);
                    allWords = [...vocabulary.seasons, ...vocabulary.clothes];
                    renderWordList('seasons');
                    renderWordList('clothes');
                    updateImportExport();
                    
                    alert(`✅ Zaimportowano słówka!\n\n` +
                          `Pory roku: ${data.seasons.length}\n` +
                          `Ubrania: ${data.clothes.length}\n` +
                          `Razem: ${data.seasons.length + data.clothes.length} słówek`);
                    
                } catch (e) {
                    alert('❌ Błąd odczytu pliku JSON!\n\n' + e.message);
                }
            };
            reader.readAsText(file);
            
            // Reset input
            event.target.value = '';
        }

        function resetToDefault() {
            if (confirm('Czy na pewno chcesz przywrócić domyślną listę słówek? Wszystkie zmiany zostaną utracone!')) {
                vocabulary = JSON.parse(JSON.stringify(defaultVocabulary));
                saveVocabulary(vocabulary);
                allWords = [...vocabulary.seasons, ...vocabulary.clothes];
                renderWordList('seasons');
                renderWordList('clothes');
                updateImportExport();
                alert('✅ Przywrócono domyślne słówka!');
            }
        }

        function showCelebration() {
            const celebration = document.createElement('div');
            celebration.className = 'celebration';
            celebration.innerHTML = `
                <h2>🎉 Gratulacje! 🎉</h2>
                <div class="celebration-emoji">🌟⭐✨</div>
                <p style="font-size: 1.5em; color: #666;">Ukończyłeś grę!</p>
                <p style="font-size: 1.3em; color: #667eea; margin-top: 10px;">Wynik: ${score} punktów</p>
                <p style="font-size: 1.2em; color: #52c234; margin-top: 10px;">Poprawne odpowiedzi: ${correct}</p>
                <button class="play-again-btn" onclick="location.reload()">🔄 Zagraj ponownie</button>
            `;
            document.body.appendChild(celebration);
        }

        // Inicjalizacja gry
        updateActiveCategoriesDisplay();
        initGame();
    </script>
</body>
</html>
